# =============================================================================
# Netlify Configuration — RoboDev Labs
# https://docs.netlify.com/configure-builds/file-based-configuration/
# =============================================================================

# ---------------------------------------------------------------------------
# Build Settings
# ---------------------------------------------------------------------------
[build]
  base    = "robodev-labs"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Dev Settings (netlify dev)
# ---------------------------------------------------------------------------
[dev]
  command   = "npm run dev"
  port      = 4321
  targetPort = 4321

# ---------------------------------------------------------------------------
# Headers — Security + Performance
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "SAMEORIGIN"
    # Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"
    # XSS protection
    X-XSS-Protection = "1; mode=block"
    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions policy — disable unnecessary browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # HSTS — enforce HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Favicon & manifest — moderate cache
[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Sitemap & robots.txt — short cache so search engines get fresh versions
[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ---------------------------------------------------------------------------
# Redirects
# ---------------------------------------------------------------------------

# Trailing-slash normalization — redirect www to non-www (if custom domain)
[[redirects]]
  from   = "https://www.robodevlabs.com/*"
  to     = "https://robodevlabs.com/:splat"
  status = 301
  force  = true

# Fallback 404 for any unmatched routes — Netlify also auto-serves 404.html
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

# ---------------------------------------------------------------------------
# Plugins (none required for static Astro export)
# ---------------------------------------------------------------------------
